<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
  </div>
  <div id="findbar" hidden>
    <input id="find-input" type="text" placeholder="find in paper…" spellcheck="false" autocomplete="off">
    <span id="find-count"></span>
    <button id="find-prev" title="Previous match (⇧↩)">↑</button>
    <button id="find-next" title="Next match (↩)">↓</button>
    <button id="find-close" title="Close (esc)">✕</button>
  </div>
  <div id="peek" hidden>
    <div id="peek-text"></div>
    <div id="peek-foot">
      <span id="peek-page"></span>
      <button id="peek-go" title="Jump there (⌘-click a link to jump directly)">go to ↓</button>
    </div>
  </div>
  <script type="module" src="viewer.mjs"></script>
</body>
</html>
