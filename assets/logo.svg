<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- papyr: a happy little paper -->
  <g>
    <path d="M14 10 c0 -3.3 2.7 -6 6 -6 h20 l10 10 v34 c0 3.3 -2.7 6 -6 6 h-24 c-3.3 0 -6 -2.7 -6 -6 z"
          fill="#f2e5cf" stroke="#5c4a38" stroke-width="3" stroke-linejoin="round"/>
    <path d="M40 4 l10 10 h-7 c-1.7 0 -3 -1.3 -3 -3 z"
          fill="#e3c9a3" stroke="#5c4a38" stroke-width="3" stroke-linejoin="round"/>
    <!-- closed happy eyes -->
    <path d="M24 30 q3 -3.4 6 0" fill="none" stroke="#5c4a38" stroke-width="3" stroke-linecap="round"/>
    <path d="M38 30 q3 -3.4 6 0" fill="none" stroke="#5c4a38" stroke-width="3" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M29 38 q5 4.6 10 0" fill="none" stroke="#5c4a38" stroke-width="3" stroke-linecap="round"/>
    <!-- blush -->
    <circle cx="21.5" cy="36" r="2.6" fill="#e8a87c"/>
    <circle cx="46.5" cy="36" r="2.6" fill="#e8a87c"/>
  </g>
